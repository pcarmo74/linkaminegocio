<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background square with brand lime -->
  <rect width="64" height="64" rx="14" fill="#D2E823"/>

  <!-- Fig body: rounded teardrop in deep purple -->
  <path
    d="M32 56c-10 0-17-7-17-17 0-9 4-16 10-20 2-1 3-3 3-5V12c0-1 1-2 2-2h4c1 0 2 1 2 2v2c0 2 1 4 3 5 6 4 10 11 10 20 0 10-7 17-17 17z"
    fill="#5B1F5E"
  />

  <!-- Fig highlight on the left to give it shape -->
  <path
    d="M24 28c-3 3-5 7-5 12 0 7 4 12 11 13-5-3-8-8-8-15 0-4 1-7 2-10z"
    fill="#7B2D80"
    opacity="0.8"
  />

  <!-- Stem -->
  <rect x="30" y="8" width="4" height="6" rx="1" fill="#1E2330"/>

  <!-- Leaf on the left -->
  <path
    d="M30 12c-6-3-12-2-14 1 2 4 8 6 13 3-1-1-1-2 0-3z"
    fill="#1E2330"
  />

  <!-- Leaf on the right -->
  <path
    d="M34 12c6-3 12-2 14 1-2 4-8 6-13 3 1-1 1-2 0-3z"
    fill="#1E2330"
  />

  <!-- Tiny seed dots inside the fig -->
  <circle cx="30" cy="36" r="1.2" fill="#FFC0CB" opacity="0.6"/>
  <circle cx="35" cy="40" r="1.2" fill="#FFC0CB" opacity="0.6"/>
  <circle cx="28" cy="44" r="1.2" fill="#FFC0CB" opacity="0.6"/>
  <circle cx="36" cy="47" r="1.2" fill="#FFC0CB" opacity="0.6"/>
  <circle cx="31" cy="48" r="1.2" fill="#FFC0CB" opacity="0.6"/>
</svg>
